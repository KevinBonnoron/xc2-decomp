name: Main build

# Builds main on every push to it, with the same job as pr.yml (`check --compile`: every source and header with the
# original compiler and the game's flags, no game executable). It exists for two reasons:
#   - the badge of the README, which shows the state of the default branch;
#   - the caches: one written on main is readable by every pull request, one written by a pull request only by that
#     pull request. Pull requests restore the Nix store and the compilation saved here instead of starting cold.
#
# It runs on push only, never on the code of a pull request.
on:
  push:
    branches: [main]

permissions:
  contents: read

# A push never cancels the build of the previous one: a cancelled run saves no cache.
concurrency:
  group: main-build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The same key as the pull request jobs, which restore this entry.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # The toolchain closure is about 4 GB (rooted below, so it is never collected); the bound keeps whatever
          # else the runner fetched out of the saved entry, so that the entries stay well under the 10 GB of the repository.
          gc-max-store-size-linux: 6G

      # A root for the toolchain until the end of the job, so that the garbage collection before the cache is saved
      # keeps it.
      - name: Keep the toolchain in the store
        run: nix build ".#devShells.x86_64-linux.ci" --out-link "$RUNNER_TEMP/ci-shell"

      - name: Cache the compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/check_cache
          key: check-cache-${{ hashFiles('tools/check.py', 'flake.nix', 'flake.lock') }}-${{ github.sha }}
          restore-keys: check-cache-${{ hashFiles('tools/check.py', 'flake.nix', 'flake.lock') }}-

      - name: Compile every source and header with the game's flags
        run: time nix develop .#ci --command check --compile
