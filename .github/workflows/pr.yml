name: Pull request checks

# Every pull request against main, forks included, with no game executable: nothing here reads work/main_100.elf.
# `check`, which compares every function with the game, still runs locally before a merge (see CONTRIBUTING.md).
#
# The workflow runs in the unprivileged `pull_request` context (read-only token, no secrets). Never switch it to
# `pull_request_target`: it checks out and runs the code of the pull request.
#
# `edited` also fires for a change of the body and re-runs everything: the title is checked, and a skipped job would
# count as a success for the required check, so a run must never be partial. A draft is checked like any other pull
# request. A pull request that conflicts with main gets no merge commit and therefore no run at all.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # HEAD is the merge of the pull request into main; its first parent is main.
  #
  # The scripts that judge a pull request (quality gate, hygiene, title) run from the copy in main, so a pull request
  # cannot weaken them by editing them. Only a script main does not have yet (the pull request that introduces it)
  # runs from the merge copy. They are laid out under $RUNNER_TEMP/judge as in the repository.
  #
  # Trust model: this is not tamper-proof. The workflow file, tools/check.py, tools/includes.py, tools/iwyu.imp,
  # flake.nix, flake.lock, .clang-format, .gitattributes and .githooks/commit-msg still come from the merge commit, so
  # a pull request that edits them can change what the build, format, includes and aggregator jobs do, or drop a job.
  # It cannot reach a secret (there is none) or a cache written on main. The owner therefore reviews every change under
  # .github/, tools/, flake.* and .clang-format, and runs the full `check` against the game before merging.
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Take the gate from main
        run: |
          mkdir -p "$RUNNER_TEMP/judge/tools"
          if git cat-file -e HEAD^1:tools/quality_gate.py 2>/dev/null; then
            git show HEAD^1:tools/quality_gate.py >"$RUNNER_TEMP/judge/tools/quality_gate.py"
          else
            cp tools/quality_gate.py "$RUNNER_TEMP/judge/tools/quality_gate.py"
          fi

      - name: Check the added code
        run: python3 -I "$RUNNER_TEMP/judge/tools/quality_gate.py" HEAD^1 HEAD

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Take the script from main
        run: |
          mkdir -p "$RUNNER_TEMP/judge/tools"
          if git cat-file -e HEAD^1:tools/hygiene.py 2>/dev/null; then
            git show HEAD^1:tools/hygiene.py >"$RUNNER_TEMP/judge/tools/hygiene.py"
          else
            cp tools/hygiene.py "$RUNNER_TEMP/judge/tools/hygiene.py"
          fi

      - name: Look for files that must not be committed
        run: python3 -I "$RUNNER_TEMP/judge/tools/hygiene.py" HEAD^1 HEAD

  title:
    name: Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      # The check runs .githooks/commit-msg, so both come from main.
      - name: Take the script and the commit-msg hook from main
        run: |
          for file in tools/check_title.sh .githooks/commit-msg; do
            mkdir -p "$RUNNER_TEMP/judge/$(dirname "$file")"
            if git cat-file -e "HEAD^1:$file" 2>/dev/null; then
              git show "HEAD^1:$file" >"$RUNNER_TEMP/judge/$file"
            else
              cp "$file" "$RUNNER_TEMP/judge/$file"
            fi
          done

      # Squash merges only: the title becomes the commit message on main. It reaches the script through the
      # environment and is never expanded in a shell command.
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash "$RUNNER_TEMP/judge/tools/check_title.sh"

  # The toolchain is the dev shell of the flake (`ci`: the same compiler and tools as `nix develop`, without the
  # game setup tools and Ghidra). The caches below are seeded by main.yml on every push to main: a cache written by a
  # pull request is only readable by that pull request, one written on main by every pull request. This job also saves
  # them (the Nix store, then the compilation) when its own run has something new.
  build:
    name: Build
    runs-on: ubuntu-latest
    # A cold full compile takes 6 to 15 CPU minutes (measured on 16 threads: 29 s on an idle machine, 70 s on a
    # loaded one), so 2 to 8 minutes on 4 vCPUs. The rest of the budget is the Nix toolchain download on a cold cache.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Objects are reused until their source, a header they include, check.py or the toolchain changes.
      - name: Cache the compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/check_cache
          key: check-cache-${{ hashFiles('tools/check.py', 'flake.nix', 'flake.lock') }}-${{ github.sha }}
          restore-keys: check-cache-${{ hashFiles('tools/check.py', 'flake.nix', 'flake.lock') }}-

      - name: Compile every source and header with the game's flags
        run: time nix develop .#ci --command check --compile

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Check the formatting of the changed files
        run: nix develop .#ci --command format --check HEAD^1

  includes:
    name: Includes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      # As the pre-commit hook: include-what-you-use on the sources and headers the pull request adds or changes.
      - name: Check the includes of the changed files
        run: |
          mapfile -d '' -t files < <(git diff -z --name-only --diff-filter=ACMR HEAD^1 HEAD -- 'src/*.h' 'src/*.cpp' 'include/*.h' 'include/*.cpp')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No source or header changed."
            exit 0
          fi
          nix develop .#ci --command includes "${files[@]}"

  # Not part of the required checks: it only annotates. clang-tidy on the lines the pull request adds, for dead
  # stores, uninitialised reads, identical branches and self assignments, which the quality gate cannot see. On the
  # diffs of the last 30 commits of main it reported 4 findings, so it cannot block yet.
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Analyze the added lines
        continue-on-error: true
        run: nix develop .#ci --command tidy --github HEAD^1 HEAD

  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compile the Python tools
        run: python3 -m compileall -q tools

      - name: Run the unit tests of the tools
        run: python3 -m unittest discover -s tools/tests

      - name: Lint the shell scripts
        run: shellcheck tools/*.sh .githooks/*

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  # One status for branch protection: fails unless every check above succeeded (a skipped or cancelled one counts as
  # a failure).
  pr-checks:
    name: Pull request checks
    if: always()
    needs: [quality-gate, hygiene, title, build, format, includes, tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::These checks did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "Every check succeeded."
