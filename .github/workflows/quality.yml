name: Quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - include/**
      - tools/quality_gate.py
      - .github/workflows/quality.yml

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      # HEAD is the merge of the pull request into main; its first parent is main.
      - name: Check the added code
        run: python3 -I tools/quality_gate.py HEAD^1 HEAD
