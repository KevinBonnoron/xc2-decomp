name: Publish progress

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - README.md
      - tools/progress.py
      - .github/workflows/progress.yml
  push:
    branches: [main]
    paths:
      - README.md
      - tools/progress.py
      - .github/workflows/progress.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate report from verified README snapshot
        run: python3 tools/progress.py > "$RUNNER_TEMP/progress.json"

      - name: Upload report for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: progress-preview
          path: ${{ runner.temp }}/progress.json
          if-no-files-found: error

      - name: Send progress to decompilati.onl
        if: >-
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           contains(github.event.pull_request.labels.*.name, 'publish-progress'))
        env:
          DECOMP_API_KEY: ${{ secrets.DECOMP_API_KEY }}
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$DECOMP_API_KEY" ]; then
            echo '::error::Add the project API key as the DECOMP_API_KEY repository Actions secret.'
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            "https://decompilati.onl/api/v1/progress?commit=$REPORT_COMMIT" \
            -H "Authorization: Bearer $DECOMP_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/progress.json"
